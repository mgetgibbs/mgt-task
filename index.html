<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MGT daily Planner</title>
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <style>
      :root {
        --bg: #0c192c;
        --panel: #0f233d;
        --panel-2: #163252;
        --primary: #0284c7;
        --primary-2: #38bdf8;
        --text: #f0f9ff;
        --muted: #94a3b8;
        --success: #34d399;
        --danger: #f87171;
        --shadow: rgba(2, 132, 199, 0.25);
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        font-family: Inter, "Segoe UI", sans-serif;
        background:
          radial-gradient(circle at top, rgba(56, 189, 248, 0.2), transparent 45%),
          linear-gradient(160deg, #030d1a 0%, var(--bg) 100%);
        color: var(--text);
        padding: 24px 16px;
      }

      .app {
        width: min(98vw, 1540px);
        background: rgba(15, 35, 61, 0.88);
        border: 1px solid rgba(56, 189, 248, 0.2);
        border-radius: 24px;
        box-shadow: 0 24px 80px var(--shadow);
        backdrop-filter: blur(14px);
        overflow: hidden;
      }

      .header {
        padding: 22px 32px 18px;
        background: linear-gradient(135deg, rgba(2, 132, 199, 0.28), rgba(56, 189, 248, 0.1));
        border-bottom: 1px solid rgba(56, 189, 248, 0.15);
        display: flex;
        justify-content: space-between;
        align-items: center;
        flex-wrap: wrap;
        gap: 16px;
      }

      h1 {
        margin: 0;
        font-size: clamp(1.8rem, 2.8vw, 2.4rem);
        letter-spacing: -0.05em;
        color: #e0f2fe;
      }

      .subtitle {
        margin-top: 5px;
        color: #93c5fd;
        font-size: 0.92rem;
      }

      .quick-links {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
      }

      .quick-btn {
        display: inline-flex;
        align-items: center;
        padding: 8px 16px;
        background: rgba(12, 25, 44, 0.85);
        border: 1px solid rgba(56, 189, 248, 0.3);
        border-radius: 12px;
        color: #bae6fd;
        text-decoration: none;
        font-size: 0.88rem;
        font-weight: 600;
        transition: all 0.2s ease;
      }

      .quick-btn:hover {
        background: rgba(2, 132, 199, 0.35);
        border-color: var(--primary-2);
        color: #ffffff;
        transform: translateY(-1px);
      }

      /* Reorderable Workspace Grid */
      .workspace-grid {
        display: grid;
        grid-template-columns: 1.15fr 0.95fr 1.1fr;
        gap: 22px;
        padding: 24px 28px 28px;
        align-items: stretch;
      }

      .column-card {
        display: flex;
        flex-direction: column;
        background: rgba(12, 25, 44, 0.65);
        border: 1px solid rgba(56, 189, 248, 0.2);
        border-radius: 18px;
        padding: 16px 20px 20px;
        transition: transform 0.2s ease, opacity 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
        position: relative;
      }

      /* Drag and Drop Visual States */
      .column-card.dragging {
        opacity: 0.35;
        border: 2px dashed var(--primary-2);
        transform: scale(0.98);
      }

      .column-card.drag-over {
        border-color: var(--primary-2);
        box-shadow: 0 0 20px rgba(56, 189, 248, 0.35);
        transform: translateY(-2px);
      }

      /* Card Drag Handle Bar */
      .card-drag-handle {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 4px;
        padding: 4px 0 8px;
        margin-bottom: 6px;
        cursor: grab;
        color: rgba(148, 163, 184, 0.4);
        transition: color 0.2s ease;
        user-select: none;
      }

      .card-drag-handle:hover {
        color: var(--primary-2);
      }

      .card-drag-handle:active {
        cursor: grabbing;
      }

      .drag-dots {
        width: 32px;
        height: 4px;
        background: currentColor;
        border-radius: 4px;
        opacity: 0.6;
      }

      .composer {
        display: flex;
        gap: 10px;
        margin-bottom: 16px;
      }

      input[type="text"] {
        flex: 1;
        border: 1px solid rgba(56, 189, 248, 0.25);
        background: rgba(12, 25, 44, 0.85);
        color: var(--text);
        border-radius: 12px;
        padding: 13px 15px;
        font-size: 0.96rem;
        outline: none;
        transition: border-color 0.2s ease, box-shadow 0.2s ease;
      }

      input[type="text"]:focus,
      textarea:focus {
        border-color: var(--primary-2);
        box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.2);
      }

      button {
        border: 0;
        border-radius: 12px;
        cursor: pointer;
        transition: transform 0.15s ease, opacity 0.15s ease, filter 0.2s ease, box-shadow 0.2s ease;
      }

      button:hover {
        transform: translateY(-1px);
        filter: brightness(1.1);
      }

      button:active {
        transform: translateY(0);
        filter: brightness(0.95);
      }

      .primary-btn {
        background: linear-gradient(135deg, var(--primary), var(--primary-2));
        color: #031e38;
        padding: 0 16px;
        font-weight: 700;
        font-size: 0.88rem;
        min-height: 38px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        white-space: nowrap;
        box-shadow: 0 2px 8px rgba(2, 132, 199, 0.2);
      }

      .secondary-btn {
        background: rgba(56, 189, 248, 0.12);
        color: #bae6fd;
        border: 1px solid rgba(56, 189, 248, 0.3);
        padding: 6px 12px;
        font-weight: 600;
        font-size: 0.84rem;
        min-height: 36px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        white-space: nowrap;
      }

      .secondary-btn:hover {
        background: rgba(56, 189, 248, 0.22);
        color: #ffffff;
      }

      .danger-btn {
        background: rgba(248, 113, 113, 0.15);
        color: #fecaca;
        border: 1px solid rgba(248, 113, 113, 0.3);
        padding: 6px 12px;
        font-weight: 600;
        font-size: 0.84rem;
        min-height: 36px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        white-space: nowrap;
      }

      .danger-btn:hover {
        background: rgba(248, 113, 113, 0.28);
        color: #ffffff;
      }

      .toolbar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 10px;
        margin-bottom: 14px;
        flex-wrap: wrap;
      }

      .filters {
        display: flex;
        gap: 6px;
        flex-wrap: wrap;
      }

      .filter-btn {
        background: rgba(56, 189, 248, 0.08);
        color: var(--text);
        padding: 7px 12px;
        font-size: 0.85rem;
      }

      .filter-btn.active {
        background: rgba(2, 132, 199, 0.28);
        color: #bae6fd;
        border: 1px solid rgba(56, 189, 248, 0.6);
      }

      .stats {
        color: #93c5fd;
        font-size: 0.85rem;
      }

      .list {
        list-style: none;
        padding: 0;
        margin: 0;
        display: grid;
        gap: 10px;
        height: 520px;
        max-height: 520px;
        overflow-y: auto;
        padding-right: 4px;
      }

      .task {
        display: flex;
        align-items: center;
        gap: 12px;
        background: rgba(22, 50, 82, 0.7);
        border: 1px solid rgba(56, 189, 248, 0.15);
        border-radius: 12px;
        padding: 12px 14px;
      }

      .task.completed { opacity: 0.65; }
      .task.completed .task-text { text-decoration: line-through; color: #64748b; }

      .checkbox {
        width: 20px;
        height: 20px;
        border-radius: 7px;
        border: 2px solid rgba(56, 189, 248, 0.7);
        background: transparent;
        position: relative;
        flex-shrink: 0;
      }

      .task.completed .checkbox {
        background: linear-gradient(135deg, var(--success), #22c55e);
        border-color: transparent;
      }

      .task.completed .checkbox::after {
        content: "";
        position: absolute;
        left: 5px;
        top: 2px;
        width: 5px;
        height: 9px;
        border: solid white;
        border-width: 0 2px 2px 0;
        transform: rotate(45deg);
      }

      .task-text { flex: 1; word-break: break-word; font-size: 0.95rem; }

      .delete-btn {
        background: rgba(248, 113, 113, 0.15);
        color: #fecaca;
        padding: 6px 10px;
        font-size: 0.8rem;
      }

      .card-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 14px;
        min-height: 42px;
        gap: 12px;
      }

      .card-title {
        font-weight: 700;
        font-size: 1.05rem;
        color: #bae6fd;
        white-space: nowrap;
      }

      /* Clean Gmail Header Alignment */
      .feed-header-actions {
        display: flex;
        align-items: center;
        gap: 8px;
        flex-wrap: nowrap;
        justify-content: flex-end;
      }

      .card-status { 
        font-size: 0.78rem; 
        color: #94a3b8;
        background: rgba(15, 23, 42, 0.75);
        border: 1px solid rgba(56, 189, 248, 0.18);
        border-radius: 8px;
        padding: 6px 10px;
        max-width: 170px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        display: inline-block;
      }
      .card-status.saved { 
        color: #a7f3d0; 
        border-color: rgba(52, 211, 153, 0.4);
        background: rgba(6, 78, 59, 0.35);
      }
      .card-status.error {
        color: #fecaca;
        border-color: rgba(248, 113, 113, 0.4);
        background: rgba(127, 29, 29, 0.35);
      }

      .editor-area {
        width: 100%;
        background: rgba(8, 18, 33, 0.85);
        border: 1px solid rgba(56, 189, 248, 0.18);
        border-radius: 12px;
        color: var(--text);
        padding: 14px;
        font-family: inherit;
        font-size: 0.92rem;
        line-height: 1.55;
        resize: none;
        outline: none;
      }

      .notepad-area { 
        flex: 1; 
        height: 520px;
        min-height: 520px; 
      }

      .feed-container {
        flex: 1;
        height: 520px;
        max-height: 520px;
        background: rgba(8, 18, 33, 0.85);
        border: 1px solid rgba(56, 189, 248, 0.18);
        border-radius: 12px;
        padding: 12px;
        overflow-y: auto;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }

      /* Custom Dark Scrollbars */
      .feed-container::-webkit-scrollbar,
      .list::-webkit-scrollbar,
      .notepad-area::-webkit-scrollbar {
        width: 6px;
      }

      .feed-container::-webkit-scrollbar-track,
      .list::-webkit-scrollbar-track,
      .notepad-area::-webkit-scrollbar-track {
        background: rgba(8, 18, 33, 0.5);
        border-radius: 8px;
      }

      .feed-container::-webkit-scrollbar-thumb,
      .list::-webkit-scrollbar-thumb,
      .notepad-area::-webkit-scrollbar-thumb {
        background: rgba(56, 189, 248, 0.28);
        border-radius: 8px;
      }

      .feed-container::-webkit-scrollbar-thumb:hover,
      .list::-webkit-scrollbar-thumb:hover,
      .notepad-area::-webkit-scrollbar-thumb:hover {
        background: rgba(56, 189, 248, 0.5);
      }

      .feed-container,
      .list,
      .notepad-area {
        scrollbar-width: thin;
        scrollbar-color: rgba(56, 189, 248, 0.28) rgba(8, 18, 33, 0.5);
      }

      /* Clickable Email Item Styling */
      .email-item {
        background: rgba(15, 35, 61, 0.7);
        border: 1px solid rgba(56, 189, 248, 0.15);
        border-radius: 10px;
        padding: 12px;
        display: flex;
        flex-direction: column;
        gap: 5px;
        text-decoration: none;
        color: inherit;
        cursor: pointer;
        transition: all 0.2s ease;
      }

      .email-item:hover {
        background: rgba(22, 50, 82, 0.85);
        border-color: var(--primary-2);
        transform: translateY(-2px);
        box-shadow: 0 4px 14px rgba(2, 132, 199, 0.2);
      }

      .email-header-meta {
        display: flex;
        justify-content: space-between;
        font-size: 0.82rem;
        color: #93c5fd;
      }

      .email-from { font-weight: 700; }
      .email-subject { font-size: 0.92rem; font-weight: 600; color: #ffffff; }
      .email-snippet { font-size: 0.84rem; color: #94a3b8; line-height: 1.4; }

      .empty-feed {
        color: #64748b;
        font-size: 0.92rem;
        text-align: center;
        margin: auto;
        padding: 20px;
      }

      @media (max-width: 1200px) {
        .workspace-grid { grid-template-columns: 1fr 1fr; }
        .workspace-grid > .column-card:nth-child(3) { grid-column: span 2; }
      }

      @media (max-width: 780px) {
        .workspace-grid { grid-template-columns: 1fr; }
        .workspace-grid > .column-card:nth-child(3) { grid-column: span 1; }
        .card-header { flex-direction: column; align-items: flex-start; gap: 8px; }
        .feed-header-actions { width: 100%; justify-content: flex-start; }
      }
    </style>
  </head>
  <body>
    <main class="app">
      <header class="header">
        <div>
          <h1>MGT daily Planner</h1>
          <div class="subtitle">Keep track of your priorities, quick notes, and live inbox feed.</div>
        </div>

        <div class="quick-links">
          <a href="https://gemini.google.com" target="_blank" rel="noopener noreferrer" class="quick-btn">Gemini</a>
          <a href="https://chatgpt.com" target="_blank" rel="noopener noreferrer" class="quick-btn">ChatGPT</a>
          <a href="https://mail.google.com" target="_blank" rel="noopener noreferrer" class="quick-btn">Gmail</a>
          <a href="https://drive.google.com" target="_blank" rel="noopener noreferrer" class="quick-btn">Drive</a>
        </div>
      </header>

      <div id="workspaceGrid" class="workspace-grid">
        <section id="card-tasks" class="column-card" draggable="true" data-card-id="tasks">
          <div class="card-drag-handle" title="Drag to reorder column">
            <span class="drag-dots"></span>
          </div>

          <div class="card-header">
            <span id="plannerTitle" class="card-title">Daily Planner</span>
            <span id="taskStats" class="stats">0 tasks</span>
          </div>

          <div class="composer">
            <input id="taskInput" type="text" placeholder="Add a task..." maxlength="160" />
            <button id="addTaskBtn" class="primary-btn" type="button">Add</button>
          </div>

          <div class="toolbar">
            <div class="filters" aria-label="Filter tasks">
              <button class="filter-btn active" data-filter="all" type="button">All</button>
              <button class="filter-btn" data-filter="active" type="button">Active</button>
              <button class="filter-btn" data-filter="completed" type="button">Done</button>
            </div>
          </div>

          <ul id="taskList" class="list" aria-live="polite"></ul>
        </section>

        <aside id="card-notes" class="column-card" draggable="true" data-card-id="notes">
          <div class="card-drag-handle" title="Drag to reorder column">
            <span class="drag-dots"></span>
          </div>

          <div class="card-header">
            <span class="card-title">Quick Scratchpad</span>
            <span id="noteStatus" class="card-status">Saved</span>
          </div>
          <textarea
            id="quickNotes"
            class="editor-area notepad-area"
            placeholder="Jot down quick thoughts, links, or draft notes here..."
          ></textarea>
        </aside>

        <section id="card-gmail" class="column-card" draggable="true" data-card-id="gmail">
          <div class="card-drag-handle" title="Drag to reorder column">
            <span class="drag-dots"></span>
          </div>

          <div class="card-header">
            <span class="card-title">Live Gmail Feed</span>
            <div class="feed-header-actions">
              <span id="authStatus" class="card-status">Not connected</span>
              <button id="authBtn" class="primary-btn" type="button">Connect Gmail</button>
              <button id="refreshBtn" class="secondary-btn" type="button" style="display: none;">Refresh</button>
              <button id="signOutBtn" class="danger-btn" type="button" style="display: none;">Sign Out</button>
            </div>
          </div>

          <div id="emailFeed" class="feed-container">
            <div class="empty-feed">Click "Connect Gmail" above to link your account and view recent emails.</div>
          </div>
        </section>
      </div>
    </main>

    <script>
      // ==========================================
      // CONSTANTS & STORAGE KEYS
      // ==========================================
      const CLIENT_ID = '912308604808-p1nkq6drca0mvt60ipp9u1bpj9bh5iud.apps.googleusercontent.com';
      const GMAIL_SCOPE = 'https://www.googleapis.com/auth/gmail.readonly';
      
      const SESSION_TOKEN_KEY = 'mgt_session_access_token';
      const SESSION_USER_KEY = 'mgt_session_user_email';
      const NOTE_KEY = 'daily-focus.notes';
      const COLUMN_ORDER_KEY = 'mgt_column_order';

      let tokenClient = null;
      let isGisReady = false;
      let accessToken = localStorage.getItem(SESSION_TOKEN_KEY) || null;
      let currentUserEmail = localStorage.getItem(SESSION_USER_KEY) || null;
      let isRefreshingToken = false;

      // DOM Elements
      const workspaceGrid = document.getElementById('workspaceGrid');
      const authBtn = document.getElementById('authBtn');
      const refreshBtn = document.getElementById('refreshBtn');
      const signOutBtn = document.getElementById('signOutBtn');
      const authStatus = document.getElementById('authStatus');
      const emailFeed = document.getElementById('emailFeed');
      const plannerTitle = document.getElementById('plannerTitle');

      const taskInput = document.getElementById('taskInput');
      const addTaskBtn = document.getElementById('addTaskBtn');
      const taskList = document.getElementById('taskList');
      const taskStats = document.getElementById('taskStats');
      const filterButtons = document.querySelectorAll('.filter-btn');

      const quickNotes = document.getElementById('quickNotes');
      const noteStatus = document.getElementById('noteStatus');

      let tasks = [];
      let currentFilter = 'all';

      // ==========================================
      // DRAG & DROP COLUMN REORDERING
      // ==========================================
      let draggedCard = null;

      function initDragAndDrop() {
        restoreColumnOrder();

        const cards = document.querySelectorAll('.column-card');

        cards.forEach(card => {
          card.addEventListener('dragstart', (e) => {
            // Prevent dragging from within inputs, textareas, or buttons
            if (['INPUT', 'TEXTAREA', 'BUTTON', 'A'].includes(e.target.tagName)) {
              e.preventDefault();
              return;
            }

            draggedCard = card;
            card.classList.add('dragging');
            e.dataTransfer.effectAllowed = 'move';
            e.dataTransfer.setData('text/plain', card.dataset.cardId);
          });

          card.addEventListener('dragend', () => {
            draggedCard = null;
            cards.forEach(c => {
              c.classList.remove('dragging');
              c.classList.remove('drag-over');
            });
            saveColumnOrder();
          });

          card.addEventListener('dragover', (e) => {
            e.preventDefault();
            e.dataTransfer.dropEffect = 'move';
            if (draggedCard && draggedCard !== card) {
              card.classList.add('drag-over');
            }
          });

          card.addEventListener('dragleave', () => {
            card.classList.remove('drag-over');
          });

          card.addEventListener('drop', (e) => {
            e.preventDefault();
            card.classList.remove('drag-over');

            if (!draggedCard || draggedCard === card) return;

            const allCards = Array.from(workspaceGrid.children);
            const draggedIdx = allCards.indexOf(draggedCard);
            const targetIdx = allCards.indexOf(card);

            if (draggedIdx < targetIdx) {
              card.after(draggedCard);
            } else {
              card.before(draggedCard);
            }

            saveColumnOrder();
          });
        });
      }

      function saveColumnOrder() {
        const order = Array.from(workspaceGrid.children).map(c => c.dataset.cardId);
        localStorage.setItem(COLUMN_ORDER_KEY, JSON.stringify(order));
      }

      function restoreColumnOrder() {
        try {
          const savedOrder = JSON.parse(localStorage.getItem(COLUMN_ORDER_KEY));
          if (!savedOrder || !Array.isArray(savedOrder)) return;

          const cardsMap = {};
          Array.from(workspaceGrid.children).forEach(card => {
            cardsMap[card.dataset.cardId] = card;
          });

          savedOrder.forEach(id => {
            if (cardsMap[id]) {
              workspaceGrid.appendChild(cardsMap[id]);
            }
          });
        } catch (err) {
          console.warn('Could not restore column order:', err);
        }
      }

      // ==========================================
      // GOOGLE AUTHENTICATION & GIS HANDLING
      // ==========================================
      function initGoogleAuth() {
        if (typeof google === 'undefined' || !google.accounts || !google.accounts.oauth2) {
          setTimeout(initGoogleAuth, 120);
          return;
        }

        try {
          tokenClient = google.accounts.oauth2.initTokenClient({
            client_id: CLIENT_ID,
            scope: GMAIL_SCOPE,
            callback: async (resp) => {
              if (resp.error) {
                console.error('Google OAuth Error Response:', resp);
                authStatus.textContent = 'Auth error';
                authStatus.className = 'card-status error';
                emailFeed.innerHTML = `<div class="empty-feed" style="color:var(--danger)">Authorization failed: ${escapeHtml(resp.error_description || resp.error)}</div>`;
                isRefreshingToken = false;
                return;
              }

              if (!resp.access_token) {
                console.error('No access token received in OAuth response:', resp);
                authStatus.textContent = 'Token missing';
                authStatus.className = 'card-status error';
                isRefreshingToken = false;
                return;
              }

              accessToken = resp.access_token;
              localStorage.setItem(SESSION_TOKEN_KEY, accessToken);

              await fetchUserProfileEmail();
              setLoggedInUI(currentUserEmail);
              isRefreshingToken = false;

              fetchRecentEmails();
            }
          });

          isGisReady = true;

          if (accessToken) {
            setLoggedInUI(currentUserEmail);
            fetchRecentEmails();
          }
        } catch (err) {
          console.error('Error initializing Google Identity Services:', err);
          authStatus.textContent = 'Init error';
          authStatus.className = 'card-status error';
        }
      }

      async function fetchUserProfileEmail() {
        try {
          const res = await fetch('https://gmail.googleapis.com/gmail/v1/users/me/profile', {
            headers: { Authorization: `Bearer ${accessToken}` }
          });
          if (res.ok) {
            const data = await res.json();
            currentUserEmail = data.emailAddress || 'User';
            localStorage.setItem(SESSION_USER_KEY, currentUserEmail);
            loadUserTasks();
          } else {
            console.warn('Profile fetch returned non-200 status:', res.status);
          }
        } catch (e) {
          console.error('Network failure fetching user profile:', e);
        }
      }

      function setLoggedInUI(email) {
        const displayLabel = email ? `Connected: ${email}` : 'Connected';
        authStatus.textContent = displayLabel;
        authStatus.title = email || 'Connected';
        authStatus.className = 'card-status saved';
        
        authBtn.style.display = 'none';
        refreshBtn.style.display = 'inline-flex';
        signOutBtn.style.display = 'inline-flex';

        if (email) {
          plannerTitle.textContent = `Tasks (${email})`;
        }
      }

      function setLoggedOutUI() {
        authStatus.textContent = 'Not connected';
        authStatus.title = '';
        authStatus.className = 'card-status';
        
        authBtn.style.display = 'inline-flex';
        refreshBtn.style.display = 'none';
        signOutBtn.style.display = 'none';
        
        plannerTitle.textContent = 'Daily Planner';
        emailFeed.innerHTML = '<div class="empty-feed">Click "Connect Gmail" above to link your account and view recent emails.</div>';
      }

      authBtn.addEventListener('click', () => {
        if (!isGisReady || !tokenClient) {
          authStatus.textContent = 'Initializing...';
          authStatus.className = 'card-status';
          setTimeout(() => {
            if (isGisReady && tokenClient) {
              tokenClient.requestAccessToken({ prompt: 'consent' });
            } else {
              authStatus.textContent = 'Failed to load GIS';
              authStatus.className = 'card-status error';
              console.error('Google Identity Services script failed to initialize in time.');
            }
          }, 600);
          return;
        }

        tokenClient.requestAccessToken({ prompt: 'consent' });
      });

      refreshBtn.addEventListener('click', () => {
        if (accessToken) fetchRecentEmails();
      });

      signOutBtn.addEventListener('click', () => {
        if (accessToken && typeof google !== 'undefined' && google.accounts?.oauth2) {
          try {
            google.accounts.oauth2.revoke(accessToken, () => {});
          } catch (e) {
            console.warn('Token revocation warning:', e);
          }
        }
        localStorage.removeItem(SESSION_TOKEN_KEY);
        localStorage.removeItem(SESSION_USER_KEY);
        accessToken = null;
        currentUserEmail = null;

        setLoggedOutUI();
        loadUserTasks();
      });

      function silentlyRenewToken() {
        if (isRefreshingToken || !tokenClient) return;
        isRefreshingToken = true;
        try {
          tokenClient.requestAccessToken({ prompt: '' });
        } catch (err) {
          console.error('Silent token renewal failed:', err);
          isRefreshingToken = false;
        }
      }

      // ==========================================
      // LIVE GMAIL INBOX FETCH
      // ==========================================
      async function fetchRecentEmails() {
        if (!accessToken) return;
        emailFeed.innerHTML = '<div class="empty-feed">Fetching inbox messages...</div>';

        try {
          const listRes = await fetch('https://gmail.googleapis.com/gmail/v1/users/me/messages?maxResults=50', {
            headers: { Authorization: `Bearer ${accessToken}` }
          });

          if (listRes.status === 401) {
            silentlyRenewToken();
            return;
          }

          if (!listRes.ok) {
            const errData = await listRes.json().catch(() => ({}));
            throw new Error(errData.error?.message || `HTTP ${listRes.status}`);
          }

          const listData = await listRes.json();

          if (!listData.messages || listData.messages.length === 0) {
            emailFeed.innerHTML = '<div class="empty-feed">No messages found in your inbox.</div>';
            return;
          }

          const messagePromises = listData.messages.map(m =>
            fetch(`https://gmail.googleapis.com/gmail/v1/users/me/messages/${m.id}?format=metadata&metadataHeaders=From&metadataHeaders=Subject&metadataHeaders=Date`, {
              headers: { Authorization: `Bearer ${accessToken}` }
            }).then(r => {
              if (r.status === 401) silentlyRenewToken();
              return r.ok ? r.json() : null;
            }).catch(e => {
              console.error(`Error fetching message ${m.id}:`, e);
              return null;
            })
          );

          const fullMessages = await Promise.all(messagePromises);
          renderEmails(fullMessages.filter(m => m && m.id));
        } catch (err) {
          console.error('Error fetching Gmail messages:', err);
          emailFeed.innerHTML = `<div class="empty-feed" style="color:var(--danger)">Error fetching emails: ${escapeHtml(err.message)}</div>`;
        }
      }

      function renderEmails(messages) {
        emailFeed.innerHTML = '';

        if (!messages || messages.length === 0) {
          emailFeed.innerHTML = '<div class="empty-feed">No readable messages found.</div>';
          return;
        }

        messages.forEach(msg => {
          const headers = msg.payload?.headers || [];
          const fromHeader = headers.find(h => h.name && h.name.toLowerCase() === 'from')?.value || 'Unknown Sender';
          const subjectHeader = headers.find(h => h.name && h.name.toLowerCase() === 'subject')?.value || '(No Subject)';
          const cleanSnippet = msg.snippet ? unescapeHtml(msg.snippet) : '';

          const directUrl = `https://mail.google.com/mail/u/0/#inbox/${msg.id}`;

          const item = document.createElement('a');
          item.className = 'email-item';
          item.href = directUrl;
          item.target = '_blank';
          item.rel = 'noopener noreferrer';
          item.title = 'Open in Gmail';

          item.innerHTML = `
            <div class="email-header-meta">
              <span class="email-from">${escapeHtml(cleanSender(fromHeader))}</span>
            </div>
            <div class="email-subject">${escapeHtml(subjectHeader)}</div>
            <div class="email-snippet">${escapeHtml(cleanSnippet)}</div>
          `;
          emailFeed.appendChild(item);
        });
      }

      function cleanSender(sender) {
        const match = sender.match(/^"?([^"<]+)"?\s*<.*>$/);
        return match ? match[1].trim() : sender;
      }

      function escapeHtml(str) {
        return String(str).replace(/[&<>"']/g, m => ({
          '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
        }[m]));
      }

      function unescapeHtml(str) {
        const doc = new DOMParser().parseFromString(str, 'text/html');
        return doc.body.textContent || '';
      }

      // ==========================================
      // USER-SPECIFIC TASK STORAGE LOGIC
      // ==========================================
      function getTaskStorageKey() {
        return currentUserEmail ? `tasks_${currentUserEmail.toLowerCase()}` : 'tasks_guest';
      }

      function loadUserTasks() {
        const key = getTaskStorageKey();
        try {
          const saved = localStorage.getItem(key);
          if (saved) {
            tasks = JSON.parse(saved);
          } else {
            tasks = [
              { id: crypto.randomUUID(), text: 'Plan your top 3 priorities', completed: false },
              { id: crypto.randomUUID(), text: 'Review inbox feed and clean emails', completed: false }
            ];
            saveUserTasks();
          }
        } catch (error) {
          console.error('Error parsing stored tasks:', error);
          tasks = [];
        }
        renderTasks();
      }

      function saveUserTasks() {
        localStorage.setItem(getTaskStorageKey(), JSON.stringify(tasks));
      }

      function getFilteredTasks() {
        if (currentFilter === 'active') return tasks.filter(t => !t.completed);
        if (currentFilter === 'completed') return tasks.filter(t => t.completed);
        return tasks;
      }

      function updateStats() {
        const remaining = tasks.filter(t => !t.completed).length;
        const total = tasks.length;
        taskStats.textContent = `${total === 1 ? '1 task' : `${total} tasks`} • ${remaining} left`;
      }

      function renderTasks() {
        const filtered = getFilteredTasks();
        taskList.innerHTML = '';

        if (filtered.length === 0) {
          const empty = document.createElement('li');
          empty.className = 'empty';
          empty.textContent = currentFilter === 'all' ? 'No tasks yet.' : 'No tasks in this view.';
          taskList.appendChild(empty);
          updateStats();
          return;
        }

        filtered.forEach(task => {
          const item = document.createElement('li');
          item.className = `task ${task.completed ? 'completed' : ''}`;

          const checkbox = document.createElement('button');
          checkbox.type = 'button';
          checkbox.className = 'checkbox';
          checkbox.setAttribute('aria-label', task.completed ? 'Mark task as incomplete' : 'Mark task as complete');
          checkbox.addEventListener('click', () => toggleTask(task.id));

          const text = document.createElement('span');
          text.className = 'task-text';
          text.textContent = task.text;

          const deleteBtn = document.createElement('button');
          deleteBtn.type = 'button';
          deleteBtn.className = 'delete-btn';
          deleteBtn.textContent = 'Delete';
          deleteBtn.addEventListener('click', () => deleteTask(task.id));

          item.appendChild(checkbox);
          item.appendChild(text);
          item.appendChild(deleteBtn);
          taskList.appendChild(item);
        });

        updateStats();
      }

      function addTask() {
        const value = taskInput.value.trim();
        if (!value) return;

        tasks.unshift({ id: crypto.randomUUID(), text: value, completed: false });
        taskInput.value = '';
        taskInput.focus();
        saveUserTasks();
        renderTasks();
      }

      function toggleTask(taskId) {
        tasks = tasks.map(t => t.id === taskId ? { ...t, completed: !t.completed } : t);
        saveUserTasks();
        renderTasks();
      }

      function deleteTask(taskId) {
        tasks = tasks.filter(t => t.id !== taskId);
        saveUserTasks();
        renderTasks();
      }

      addTaskBtn.addEventListener('click', addTask);
      taskInput.addEventListener('keydown', e => { if (e.key === 'Enter') addTask(); });

      filterButtons.forEach(button => {
        button.addEventListener('click', () => {
          currentFilter = button.dataset.filter;
          filterButtons.forEach(btn => btn.classList.toggle('active', btn === button));
          renderTasks();
        });
      });

      // ==========================================
      // SCRATCHPAD AUTO-SAVE & PAGE INITIALIZATION
      // ==========================================
      quickNotes.value = localStorage.getItem(NOTE_KEY) || '';

      let noteTimeout;
      quickNotes.addEventListener('input', () => {
        noteStatus.textContent = 'Saving...';
        noteStatus.classList.remove('saved');
        clearTimeout(noteTimeout);
        noteTimeout = setTimeout(() => {
          localStorage.setItem(NOTE_KEY, quickNotes.value);
          noteStatus.textContent = 'Saved';
          noteStatus.classList.add('saved');
        }, 350);
      });

      window.addEventListener('DOMContentLoaded', () => {
        initDragAndDrop();

        if (accessToken) {
          setLoggedInUI(currentUserEmail);
        } else {
          setLoggedOutUI();
        }

        loadUserTasks();
        initGoogleAuth();
      });
    </script>
  </body>
</html>
